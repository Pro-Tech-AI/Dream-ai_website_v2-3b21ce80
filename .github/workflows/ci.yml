# Pro Tech AI standard CI — runs on every promotion PR (dev, test, main/master).
# Stack-aware (Node / Python / .NET / other) and stage-aware: checks get deeper
# as code moves up. Always produces a test report (job summary + artifact).
name: ci
on:
  pull_request:
    branches: [dev, test, main, master]
permissions:
  contents: read
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Detect stack
        id: stack
        run: |
          s=other
          [ -f package.json ] && s=node
          { ls *.py >/dev/null 2>&1 || [ -f requirements.txt ] || [ -f pyproject.toml ]; } && s=python
          ls *.sln */*.csproj *.csproj >/dev/null 2>&1 && s=dotnet
          echo "stack=$s" >> "$GITHUB_OUTPUT"
          echo "Detected stack: $s (stage: $STAGE)"

      - if: steps.stack.outputs.stack == 'node'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: steps.stack.outputs.stack == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: steps.stack.outputs.stack == 'dotnet'
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.x }

      - name: Install, lint, build, test (per stack)
        id: run
        run: |
          set -uo pipefail
          mkdir -p test-report
          PASS=0; FAIL=0; SKIP=0
          note () { echo "$1" >> test-report/report.md; }
          run_step () { # label command...
            local label="$1"; shift
            echo "::group::$label"
            if "$@" > "test-report/${label// /_}.log" 2>&1; then
              note "| $label | ✅ pass |"; PASS=$((PASS+1))
            else
              note "| $label | ❌ FAIL |"; FAIL=$((FAIL+1))
            fi
            echo "::endgroup::"
          }
          skip_step () { note "| $1 | ⏭ not configured |"; SKIP=$((SKIP+1)); }
          note "# Test report — ${GITHUB_REPOSITORY} (#${{ github.event.pull_request.number }})"
          note ""
          note "PR: \`${{ github.head_ref }}\` → \`$STAGE\` · stack: **${{ steps.stack.outputs.stack }}** · $(date -u +%Y-%m-%dT%H:%MZ)"
          note ""
          note "| Check | Result |"
          note "|---|---|"
          case "${{ steps.stack.outputs.stack }}" in
            node)
              [ -f package-lock.json ] && run_step "install" npm ci || run_step "install" npm install
              node -e "const s=require('./package.json').scripts||{};process.exit(s.lint?0:1)" && run_step "lint" npm run lint || skip_step "lint"
              node -e "const s=require('./package.json').scripts||{};process.exit(s.test?0:1)" && run_step "unit tests" npm test --silent -- --ci || skip_step "unit tests"
              if [ "$STAGE" = "test" ] || [ "$STAGE" = "main" ] || [ "$STAGE" = "master" ]; then
                node -e "const s=require('./package.json').scripts||{};process.exit(s.build?0:1)" && run_step "build" npm run build || skip_step "build"
                node -e "const s=require('./package.json').scripts||{};process.exit(s['test:integration']?0:1)" && run_step "integration tests" npm run test:integration || skip_step "integration tests"
              fi
              if [ "$STAGE" = "main" ] || [ "$STAGE" = "master" ]; then
                node -e "const s=require('./package.json').scripts||{};process.exit(s['test:e2e']?0:1)" && run_step "e2e tests" npm run test:e2e || skip_step "e2e tests"
              fi ;;
            python)
              [ -f requirements.txt ] && run_step "install" pip install -r requirements.txt || skip_step "install"
              pip install pytest >/dev/null 2>&1
              if ls tests/*.py test_*.py */test_*.py >/dev/null 2>&1; then
                run_step "unit tests" python -m pytest -q --junitxml=test-report/junit.xml
              else skip_step "unit tests"; fi
              pip install ruff >/dev/null 2>&1 && run_step "lint" python -m ruff check . || skip_step "lint" ;;
            dotnet)
              run_step "restore+build" dotnet build --nologo -clp:ErrorsOnly
              run_step "unit tests" dotnet test --no-build --nologo --logger "trx;LogFileName=junit.trx" ;;
            other)
              skip_step "lint"; skip_step "unit tests"
              note ""
              note "> No recognised stack — add scripts (npm) / tests (pytest) / a solution (.NET) to activate checks." ;;
          esac
          note ""
          note "**Summary: $PASS passed · $FAIL failed · $SKIP not configured**"
          echo "fails=$FAIL" >> "$GITHUB_OUTPUT"
          cat test-report/report.md >> "$GITHUB_STEP_SUMMARY"
          [ "$FAIL" -eq 0 ]

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: test-report/
          retention-days: 30
  security-gates:
    name: security-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (full history)
        run: |
          set -uo pipefail
          mkdir -p sec-report
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --no-banner --exit-code 1 \
            --report-format json --report-path /repo/sec-report/gitleaks.json \
            && echo "secret-scan: clean" | tee sec-report/summary.txt \
            || { echo "secret-scan: FINDINGS — see artifact" | tee sec-report/summary.txt; exit 1; }
      - name: Dependency audit (best effort)
        if: always()
        run: |
          set +e
          [ -f package.json ] && npm audit --omit=dev --audit-level=high >> sec-report/audit.txt 2>&1
          [ -f requirements.txt ] && pipx run pip-audit -r requirements.txt >> sec-report/audit.txt 2>&1
          true
      - name: Security summary
        if: always()
        run: |
          { echo "## Security gates"; echo '```'; cat sec-report/summary.txt 2>/dev/null; tail -20 sec-report/audit.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: sec-report/
          retention-days: 30
